name: RaceDay Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore solution
        run: dotnet restore RaceDayAPI.sln

      - name: Build solution
        run: dotnet build RaceDayAPI.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test RaceDayAPI.sln --configuration Release --no-build